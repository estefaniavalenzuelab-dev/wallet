<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet</title>
  </head>
  <body>
    <!--Barra de navegación-->
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <h1><a class="navbar-brand" href="#">Alke Wallet</a></h1>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasDarkNavbar"
          aria-controls="offcanvasDarkNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="offcanvas offcanvas-end text-bg-dark"
          tabindex="-1"
          id="offcanvasDarkNavbar"
          aria-labelledby="offcanvasDarkNavbarLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">
              Alke Wallet
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <form class="d-flex mt-3" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-success" type="submit">Search</button>
          </form>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="menu.html"
                  >Home</a
                >
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Más
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                  <li>
                    <a class="dropdown-item" href="deposit.html">Depositar</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="sendmoney.html"
                      >Enviar Dinero</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="transactions.html"
                      >Movimientos</a
                    >
                  </li>
                  <li>
                    <hr class="dropdown-divider" />
                  </li>
                  <li>
                    <a class="dropdown-item" href="index.html">Cerrar Sesion</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Tabla de movimientos -->
    <div class="container movimientos-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold text-light mb-1">Últimos Movimientos</h2>
          <p class="text-light mb-0">Revisa tus ingresos y egresos recientes</p>
        </div>
      </div>

      <!-- resumen -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <small class="text-muted">Ingresos</small>
              <h4 class="text-success mb-0" id="totalIngresos">$0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <small class="text-muted">Egresos</small>
              <h4 class="text-danger mb-0" id="totalEgresos">$0</h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <small class="text-muted">Movimientos</small>
              <h4 class="mb-0" id="cantidadMovimientos">0</h4>
            </div>
          </div>
        </div>
      </div>

      <!-- buscador y filtros -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="row g-2">
            <div class="col-md-8">
              <input
                type="text"
                id="buscarMovimiento"
                class="form-control"
                placeholder="Buscar movimiento..."
              />
            </div>

            <div class="col-md-4">
              <select id="filtroMovimiento" class="form-select">
                <option value="todos">Todos</option>
                <option value="ingresos">Ingresos</option>
                <option value="egresos">Egresos</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- lista -->
      <div class="card shadow-sm border-0">
        <ul class="list-group list-group-flush" id="listaMovimientos"></ul>
      </div>

      <a
        href="menu.html"
        class="btn btn-secondary mt-4"
        id="btnVolverPrincipal"
      >
        Volver al Menú Principal
      </a>
    </div>

    <footer></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
