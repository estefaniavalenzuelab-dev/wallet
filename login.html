              <div class="container-padre">

              <form class="px-4 py-3">
              <div class="mb-3">
              <label for="formEmail" class="form-label">Correo electronico</label>
              <input type="email" class="form-control" id="Email" placeholder="email@example.com">
              </div>
              <div class="mb-3">

              <input type="password" class="form-control" id="Password" placeholder="Password">
              </div>
              <div class="mb-3">
                <div class="form-check">
                <input type="checkbox" class="form-check-input" id="dropdownCheck">
                <label class="form-check-label" for="dropdownCheck">
                  Recuerdame
                </label>
              </div>
            </div>
    <section>  
              <div class="botonLogin">
              <button type="submit" id="btnLogin" class="btn btn-outline-primary" href="menu.html">Ingresar</button>
              </div>
            </form>
            <div class="dropdown-divider"></div>
            <button type="submit" id="btnregistrar" class="btn btn-secondary" > Registrate aquí</button> 
                    <br><br>
